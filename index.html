    let r = await fromCache(lock); const cached = !!r;
    if (!r) { r = await fetch(lock.file); if (!r.ok) throw new Error('HTTP ' + r.status); }
    const total = +r.headers.get('content-length') || lock.size, rd = r.body.getReader(), parts = []; let got = 0;
    for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length; if (progress) $('bar').style.width = Math.min(100, got / total * 100) + '%'; }
    if (got !== lock.size) throw new Error('файл тура загружен не полностью');
    const out = new Uint8Array(got); let o = 0; for (const p of parts) { out.set(p, o); o += p.length; }
    if (String.fromCharCode(...out.subarray(0, 5)) !== 'HOLD1') throw new Error('повреждённый файл тура');
    return { lock, bytes: out, cached };
  }
  // start downloading right away, while the code is being typed
  let loaded = false;
  const bin = getBin(LOCK, true).catch(async (e) => {
    for (const prev of LOCKS.slice(1)) { try { const r = await getBin(prev, false); $('bar').style.width = '100%'; return r; } catch (e2) { /* next saved release */ } }
    throw e;
  });
  bin.then(() => { loaded = true; }, () => msg('Нет связи с сервером. Проверьте интернет и обновите страницу.', true));

  // after a successful opening: keep this page and its tour on the device, drop older tours (works without the service worker too)
  async function commit(got) {
    if (!('caches' in window)) return;
    const url = new URL(got.lock.file, location.href).href, scope = new URL('./', location.href).href;
    const tours = await caches.open(TOURS);
    if (!(await tours.match(url))) await tours.put(url, new Response(got.bytes, { headers: { 'Content-Type': 'application/octet-stream', 'Content-Length': String(got.bytes.length) } }));
    await (await caches.open(PAGES)).put(scope, new Response(SELF, { headers: { 'Content-Type': 'text/html; charset=utf-8', 'X-Hold-Tour': got.lock.file, 'X-Hold-Version': got.lock.version || '' } }));
    for (const name of await caches.keys()) {
      if (name === 'hold-vr') { await caches.delete(name); continue; }      // cache of the first published version
      const c = await caches.open(name);
      for (const req of await c.keys()) if (/\/tour-[0-9a-f]+\.bin$/.test(req.url) && req.url !== url) await c.delete(req);
    }
  }

  async function keyFor(pin, lock) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(lock.salt), iterations: lock.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  async function check(key, lock) {
    try { await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(lock.ivc) }, key, b64(lock.chk)); return true; } catch (e) { return false; }
  }
  // Only ciphertext is kept for offline playback. Give the player a revocable Blob for the selected film.
  function mediaLoader(key) {
    const encoder = new TextEncoder();
    return async (name, signal, progress) => {
      const entry = Object.hasOwn(MEDIA.files, name) && MEDIA.files[name];
      if (!entry) throw new Error('Unknown film');
      const { file, size } = entry;
      const url = new URL(file, location.href).href;
      const cache = await window.caches?.open('hold-vr-media').catch(() => null);
      const decrypt = async (bytes) => {
        if (bytes.length !== size || String.fromCharCode(...bytes.subarray(0, 5)) !== 'HFM01') {
          throw new Error('Incomplete film');
        }
        const plain = await crypto.subtle.decrypt({
          name: 'AES-GCM', iv: bytes.subarray(5, 17), additionalData: encoder.encode(name),
        }, key, bytes.subarray(17));
        if (signal.aborted) throw signal.reason;
        return new Blob([plain], { type: 'video/mp4' });
      };
      const saved = await cache?.match(url);
      if (saved) {
        try { return await decrypt(new Uint8Array(await saved.arrayBuffer())); }
        catch (error) {
          if (signal.aborted) throw error;
          await cache.delete(url);
        }
      }
      if (!navigator.onLine) throw new Error('Film has not been saved');
      const response = await fetch(url, { signal, cache: 'no-cache' });
      if (!response.ok) throw new Error('Film unavailable');
      const bytes = new Uint8Array(size), reader = response.body.getReader();
      let offset = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        if (offset + value.length > size) { await reader.cancel(); throw new Error('Unexpected film size'); }
        bytes.set(value, offset);
        offset += value.length;
        progress(offset / size);
      }
      if (offset !== size) throw new Error('Incomplete film');
      const film = await decrypt(bytes);
      if (cache) await cache.put(url, new Response(bytes, {
        headers: { 'Content-Type': 'application/octet-stream', 'Content-Length': String(size) },
      })).catch(() => {});
      return film;
    };
  }
  async function open(pin, remembered) {
    $('lock').classList.add('hidden'); $('sub').textContent = remembered ? 'Открываю тур…' : 'Проверяю код…'; msg('');
    const key = await keyFor(pin, LOCK);
    if (!(await check(key, LOCK))) { store.set(null); return fail(); }
    if ($('remember').checked) store.set(pin);
    $('sub').textContent = 'Открываю тур…';
    if (!loaded) msg('Загружаю тур…');
    const got = await bin, lock = got.lock, current = lock === LOCK;
    const k = current ? key : await keyFor(pin, lock);
    if (!current) {
      if (!(await check(k, lock))) throw new Error('код не подходит к сохранённой версии');
      msg('Нет связи для обновления. Открываю сохранённую версию ' + (lock.version || '') + '.'); await sleep(1500);
    }
    msg('Распаковываю…');
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: got.bytes.subarray(5, 17) }, k, got.bytes.subarray(17));
    let html = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    let saved = false, offline = false;
    if (current) { try { await commit(got); saved = true; } catch (e) { /* storage full or blocked: the tour still opens */ } }
    // first visit: the browser can open the page without a network only once the service worker is active — wait for it briefly
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      try { offline = await Promise.race([navigator.serviceWorker.ready.then((r) => !!r.active), sleep(4000).then(() => false)]); } catch (e) { offline = false; }
    }
    const build = { version: lock.version || '', file: lock.file, current, latest: LOCK.version, offline: saved && offline };
    if (MEDIA) window.HOLD_MEDIA = mediaLoader(await keyFor(pin, MEDIA));
    html = html.replace(/<head[^>]*>/i, (m) => m + '<script>window.HOLD_BUILD=' + JSON.stringify(build).replace(/</g, '\\u003c') + ';<\/script>');
    document.open(); document.write(html); document.close();
  }
  function fail() {
    entered = ''; draw(); $('lock').classList.remove('hidden'); $('sub').textContent = 'Введите код доступа';
    msg('Неверный код', true); $('dots').classList.remove('bad'); void $('dots').offsetWidth; $('dots').classList.add('bad');
  }

  let entered = '';
  const draw = () => [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i < entered.length));
  function press(k) {
    if (k === 'clear') entered = ''; else if (k === 'back') entered = entered.slice(0, -1);
    else if (entered.length < PIN_LEN) entered += k;
    draw(); msg('');
    if (entered.length === PIN_LEN) { const p = entered; setTimeout(() => open(p).catch(err), 120); }
  }
  const err = (e) => { $('lock').classList.remove('hidden'); msg('Не получилось открыть тур: ' + (e && e.message || e), true); };
  $('pad').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) press(b.dataset.k || b.textContent); });
  addEventListener('keydown', (e) => { if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('back'); });

  // code in the link (…/#1234) or remembered on this device → open without typing
  const fromHash = /^#(\d{4})$/.exec(location.hash);
  if (fromHash) history.replaceState(null, '', location.pathname);
  const pin = fromHash ? fromHash[1] : store.get();
  if (pin) open(pin, true).catch(err);
})();
</script>
</body>
</html>
